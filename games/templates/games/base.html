{% load static %}

<!DOCTYPE html>
<html lang="en"> <head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
        {% block title %}DealHunter{% endblock %}
    </title>

    <link rel="stylesheet" href="{% static 'games/style.css' %}">

</head>

<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="{% url 'index' %}" class="logo">🎮 DealHunter</a>

            <div class="search-bar">
                <form action="" method="get">
                    <input type="text" name="q" placeholder="Search for a game...">
                    <button type="submit">🔍</button>
                </form>
            </div>

            <div class="nav-links">
                {% if user.is_authenticated %}
                    <span>Hi, {{ user.username }}</span>
                    {% else %}
                    <a href="#" class="btn-login">Login</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <main class="container">
        {% block content %}
        {% endblock %}
    </main>

    <footer>
        <p>&copy; 2026 DealHunter - Data provided by CheapShark API</p>
    </footer>
</body>

</html>
